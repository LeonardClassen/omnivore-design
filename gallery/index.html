<!doctype html>
<html lang="en" data-theme="dark-industrial">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Omnivore Design System</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: var(--fs-base);
    line-height: var(--lh-base);
    -webkit-font-smoothing: antialiased;
    transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);
  }

  /* ---- Shell chrome (gal-*): sticky topbar with brand · nav · theme ---- */
  .gal-topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 12px 28px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .gal-brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .gal-brand-dot {
    width: 28px; height: 28px; border-radius: 8px; background: var(--brand);
    display: grid; place-items: center; color: var(--brand-contrast); font-weight: 700; font-size: 15px;
  }
  .gal-brand-name { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; color: var(--text); }
  .gal-brand-sub { font-size: 12px; color: var(--text-tertiary); }
  /* nav + theme reuse .omv-tabs, but as topbar controls they carry no baseline */
  .gal-nav.omv-tabs, .gal-theme.omv-tabs { border-bottom: 0; }
  .gal-brand-logo { width: 36px; height: 36px; object-fit: contain; border-radius: 8px; display: block; }

  /* ---- Brand-green picker (gallery-only, overrides --brand-* live) ---- */
  .gal-greenbar {
    display: flex; gap: 8px; align-items: center; overflow-x: auto;
    padding: 10px 28px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .gal-greenbar-label { font-size: 12px; color: var(--text-tertiary); white-space: nowrap; margin-right: 4px; }
  .gal-chip {
    display: flex; align-items: center; gap: 8px; flex: none; cursor: pointer;
    padding: 4px 10px 4px 4px; border-radius: 999px; font: inherit; font-size: 12px;
    background: transparent; color: var(--text-secondary); border: 1px solid var(--border);
  }
  .gal-chip.is-active { border-color: var(--text); color: var(--text); }
  .gal-chip-sw { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; }
  .gal-chip-txt { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
  .gal-chip-txt small { color: var(--text-tertiary); font-family: var(--font-mono); }

  /* ---- Example screens (ex-*): layout glue a consuming app would own ---- */
  .ex-page { max-width: 1240px; margin: 0 auto; padding: 20px 28px 60px; }
  .ex-intro { margin-bottom: 16px; }
  .ex-hint { font-size: 13px; color: var(--text-tertiary); margin: 8px 0 0; }
  .ex-frame { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg); overflow: hidden; }
  .ex-content { padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .ex-grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .ex-grid3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .ex-grid4 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .ex-split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); }
  .ex-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .ex-form { display: flex; flex-direction: column; gap: 14px; }
  .ex-list { display: flex; flex-direction: column; }
  .ex-list-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
  .ex-list-row:last-child { border-bottom: 0; }
  .ex-mono { font-family: var(--font-mono); }

  .ex-hmi { display: flex; min-height: 620px; }
  .ex-rail { width: 120px; flex: none; background: var(--surface); border-right: 1px solid var(--border); padding: 12px 8px; display: flex; flex-direction: column; gap: 6px; }
  .ex-rail-logo { width: 64px; height: 64px; object-fit: contain; margin: 0 auto 10px; display: block; }
  .ex-rail-item {
    min-height: var(--tap, 48px); border-radius: var(--radius-md); font: inherit; font-size: 14px; cursor: pointer;
    background: transparent; color: var(--text-secondary); border: 1px solid transparent; text-align: left; padding: 0 12px;
  }
  .ex-rail-item.is-active { background: var(--brand-soft); color: var(--brand); border-color: color-mix(in srgb, var(--brand) 45%, transparent); }
  .ex-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ex-hmi-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .ex-hmi-title { font-family: var(--font-mono); font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); }
  .ex-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ex-slot {
    min-height: 72px; border-radius: var(--radius-md); cursor: pointer; font: inherit; font-size: 12px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 8px;
    background: var(--surface-raised); color: var(--text); border: 1px solid var(--border);
  }
  .ex-slot.is-empty { color: var(--text-tertiary); border-style: dashed; }
  .ex-slot.is-active { border-color: var(--brand); box-shadow: var(--brand-ring); }
  .ex-slot-n { font-family: var(--font-mono); font-weight: 700; font-size: 14px; }

  .ex-cloud-top { display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .ex-cloud-logo { width: 32px; height: 32px; border-radius: 8px; }
  .ex-cloud-tabs.omv-tabs { border-bottom: 0; margin-right: auto; margin-left: 12px; }

  @media (max-width: 720px) {
    .gal-topbar, .gal-greenbar { padding-left: 16px; padding-right: 16px; }
    .ex-page { padding: 16px; }
    .ex-split { grid-template-columns: minmax(0, 1fr); }
    .ex-grid2 { grid-template-columns: minmax(0, 1fr); }
    .ex-hmi { flex-direction: column; }
    .ex-rail { width: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); }
    .ex-rail-logo { width: 40px; height: 40px; margin: 0 6px 0 0; flex: none; }
    .ex-rail-item { flex: none; }
    .ex-cloud-top { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./main.tsx"></script>
</body>
</html>
